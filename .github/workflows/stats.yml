name: Generate Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: mikhailkhorokhorin/profile-graphics@v1
        with:
          username: Jorvict
          token: ${{ secrets.GITLAB_TOKEN }}
          provider: gitlab
          charts: activity,langs,streak,summary
          theme: tokyo-night
          output_dir: dist

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update gitlab stats [skip ci]'
          file_pattern: 'dist/*.svg'
