name: Generate GitLab Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch GitLab stats and generate SVG
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: node scripts/gitlab-stats.js

      - name: Sync with latest main before commit
        run: git pull --rebase origin main

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update gitlab stats [skip ci]'
          file_pattern: 'dist/*.svg'
